name: Production health

on:
  schedule:
    # Four checks per day keep this within the free Actions allowance.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check production app and database
        run: |
          curl --fail --silent --show-error --max-time 20 --retry 2 --retry-delay 5 --retry-all-errors \
            https://abrahamic.vercel.app/api/health
