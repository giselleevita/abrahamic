name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abrahamic
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/abrahamic"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/abrahamic"

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/abrahamic"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/abrahamic"

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Test
        run: npm test
        env:
          # The Learn migration's CHECK constraints are verified against a real
          # database; without this the DB-backed tests skip themselves silently.
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/abrahamic"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/abrahamic"

      - name: Build
        run: npx next build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/abrahamic"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/abrahamic"
          NEXTAUTH_SECRET: "ci-secret-not-for-production-use"
          NEXTAUTH_URL: "http://localhost:3000"
