name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: abrahamic-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADMIN_EMAIL: editorial-ci@example.test
      E2E_ADMIN_EMAIL: editorial-ci@example.test
      E2E_ADMIN_PASSWORD: synthetic-ci-editorial-password
      RATE_LIMIT_SECRET: synthetic-ci-quota-secret-at-least-32-characters

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abrahamic
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure synthetic editorial credentials
        run: node -e "const fs=require('fs');const bcrypt=require('bcryptjs');fs.appendFileSync(process.env.GITHUB_ENV, 'ADMIN_PASSWORD_HASH='+bcrypt.hashSync(process.env.E2E_ADMIN_PASSWORD,10)+'\n')"

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/abrahamic"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/abrahamic"

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/abrahamic"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/abrahamic"

      - name: Verify licensed demonstration seed is idempotent
        run: bash scripts/verify-idempotent-seed.sh
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/abrahamic"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/abrahamic"

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Test
        run: npm test
        env:
          # The Learn migration's CHECK constraints are verified against a real
          # database; without this the DB-backed tests skip themselves silently.
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/abrahamic"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/abrahamic"

      - name: Verify preview isolation guard
        run: node --test scripts/preview-guard.test.mjs

      - name: Build
        run: npx next build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/abrahamic"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/abrahamic"
          NEXTAUTH_SECRET: "ci-secret-not-for-production-use"
          NEXTAUTH_URL: "http://localhost:3000"

      - name: Install browser for journey test
        run: npx playwright install --with-deps chromium

      - name: Run desktop, tablet and 320px flows
        run: npm run test:e2e
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/abrahamic"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/abrahamic"
          NEXTAUTH_SECRET: "ci-secret-not-for-production-use"
          NEXTAUTH_URL: "http://localhost:3100"

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
